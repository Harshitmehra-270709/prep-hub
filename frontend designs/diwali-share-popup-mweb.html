<!DOCTYPE html>
<!--
  AccioJob Diwali Offer: Share pop-up (MWeb)
  ------------------------------------------------------------
  Paste the <style>, the .dws-root block and the <script> into your page (just before </body>).

  Open it by adding data-diwali-share to any button, e.g.
    <button data-diwali-share>Share free test with your friend</button>
  or by calling DiwaliShare.open().

  The referral code is a random placeholder (DIWALI-XXXXXX), kept per browser in localStorage.
  To use a real code: DiwaliShare.code = 'ABC123'; before opening.
  Tracking: DiwaliShare.onShare = function (channel, link) { … };
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwali Share Pop-up (MWeb)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  .dws-root, .dws-root * { box-sizing: border-box; }
  .dws-root { font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; color: #0F172A; }
  .dws-root button, .dws-root a { font-family: inherit; }
  @keyframes dw-twinkle { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .dw-light { width: 6px; height: 6px; border-radius: 50%; animation-name: dw-twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  .dw-lights { position: absolute; left: 0; right: 0; top: 12px; height: 18px; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 10px; pointer-events: none; }

  .dws-overlay { position: fixed; inset: 0; z-index: 9991; background: rgba(8,15,35,.62);  display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .3s ease; }
  .dws-overlay.dws-show { opacity: 1; }
  .dws-overlay[hidden] { display: none; }
  .dws-modal { position: relative; width: 100%; max-width: 430px; max-height: 92vh; overflow: auto; background: #FFFFFF; border-radius: 22px 22px 0 0; box-shadow: 0 -20px 60px rgba(8,15,35,.45); transform: translateY(100%); transition: transform .42s cubic-bezier(.2,.9,.3,1.05); }
  .dws-show .dws-modal { transform: translateY(0); }
  .dws-head { position: relative; overflow: hidden; background: #0B1B3F; color: #FFFFFF; padding: 30px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
  .dws-grab { position: absolute; left: 50%; top: 7px; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: rgba(255,255,255,.3); }
  .dws-close { position: absolute; right: 10px; top: 26px; width: 40px; height: 40px; border: none; border-radius: 10px; background: rgba(255,255,255,.08); color: #FFFFFF; font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .dws-close:hover { background: rgba(255,255,255,.16); }
  .dws-tag { align-self: flex-start; margin-top: 12px; padding: 4px 9px; border-radius: 999px; background: rgba(255,182,39,.16); color: #FFC94D; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .dws-title { margin: 0; font-size: 16px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; padding-right: 44px; text-wrap: pretty; }
  .dws-sub { margin: 0; font-size: 11px; font-weight: 500; line-height: 1.5; color: #CBD5E1; }
  .dws-body { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
  .dws-field { display: flex; flex-direction: column; gap: 8px; }
  .dws-label { font-size: 11px; font-weight: 600; color: #475569; }
  .dws-linkrow { display: flex; gap: 8px; }
  .dws-link { flex: 1; min-width: 0; display: flex; align-items: center; padding: 0 12px; height: 40px; border: 1.5px solid #E2E8F0; border-radius: 12px; background: #F8FAFC; font-size: 11px; font-weight: 600; color: #0F172A; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dws-copy { flex: none; height: 40px; padding: 0 16px; border: 1.5px solid #2F7FEA; border-radius: 12px; background: #FFFFFF; color: #2F7FEA; font-size: 11px; font-weight: 700; cursor: pointer; }
  .dws-copy:hover { background: #EFF5FF; }
  .dws-msg { padding: 12px 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; background: #F8FAFC; font-size: 12px; font-weight: 500; line-height: 1.55; color: #0F172A; white-space: pre-wrap; word-break: break-word;  }
  .dws-msg strong { font-weight: 700; }
  .dws-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dws-wa { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 12px; background: #25D366; color: #FFFFFF; font-size: 12px; font-weight: 700; text-decoration: none; }
  .dws-wa:hover { filter: brightness(.95); color: #FFFFFF; text-decoration: none; }
  .dws-alt { height: 44px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1.5px solid #CBD5E1; background: #FFFFFF; color: #0F172A; }
  .dws-alt:hover { background: #F8FAFC; }
</style>
</head>
<body>

<div class="dws-root">
  <div class="dws-overlay" id="dws-overlay" hidden>
    <div class="dws-modal" role="dialog" aria-modal="true" aria-labelledby="dws-title">
      <div class="dws-head">
        <div class="dws-grab"></div>
        <div class="dw-lights" data-lights="18"></div>
        <button class="dws-close" type="button" aria-label="Close" data-dws-close>×</button>
        <span class="dws-tag">Diwali Special · 6–12 Nov</span>
        <h2 class="dws-title" id="dws-title">Share the free test with a friend</h2>
        <p class="dws-sub">Your friend gets a free Role Readiness test for any one of the 7 roles.</p>
      </div>
      <div class="dws-body">
        <div class="dws-field">
          <span class="dws-label">Your referral link</span>
          <div class="dws-linkrow">
            <div class="dws-link" id="dws-link"></div>
            <button class="dws-copy" id="dws-copylink" type="button">Copy</button>
          </div>
        </div>
        <div class="dws-field">
          <span class="dws-label">Message</span>
          <div class="dws-msg" id="dws-msg"></div>
        </div>
        <div class="dws-actions">
          <a class="dws-wa" id="dws-wa" href="#" target="_blank" rel="noopener">Share on WhatsApp</a>
          <button class="dws-alt" id="dws-alt" type="button">More apps</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var CONFIG = {
    baseUrl: 'https://placement.acciojob.com/job-preparation-hub/',
    storageKey: 'dw_diwali_ref_code'
  };
  var LIGHT_COLS = ['#FFC94D', '#FF8A00', '#FF4D6D', '#7CF3C5', '#FFE08A'];
  function lightsHTML(n) {
    var out = '';
    for (var i = 0; i < n; i++) {
      var c = LIGHT_COLS[i % 5];
      out += '<span class="dw-light" style="background:' + c + ';box-shadow:0 0 8px 2px ' + c + ';animation-duration:' + (1.4 + (i % 4) * 0.3) + 's;animation-delay:' + ((i % 6) * 0.2) + 's;margin-top:' + (i % 2 ? 3 : 9) + 'px"></span>';
    }
    return out;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // Static share message. *text* is bold on WhatsApp.
  function buildMessage(link) {
    return '🪔 *Happy Diwali!*\n\n' +
      'This Diwali, AccioJob brings you a special offer! 🎁\n\n' +
      'You can practise, take tests, and give AI interviews for your target role.\n\n' +
      'Choose *any 1 of 7 roles* and take its *Role Readiness Test for FREE*, from *6–12 November*.\n\n' +
      'Claim your free test here:\n' + link + '\n\n' +
      'Share it with your friends who are preparing for jobs! 🚀';
  }

  var $ = function (id) { return document.getElementById(id); };
  var overlay = $('dws-overlay');
  document.querySelectorAll('.dws-root .dw-lights[data-lights]').forEach(function (el) { el.innerHTML = lightsHTML(+el.getAttribute('data-lights')); });

  // Random placeholder code, kept per browser. Replace with your backend's referral code if needed.
  function getCode() {
    var code = null; try { code = localStorage.getItem(CONFIG.storageKey); } catch (e) {}
    if (!code) { code = 'DIWALI-' + Math.random().toString(36).slice(2, 8).toUpperCase(); try { localStorage.setItem(CONFIG.storageKey, code); } catch (e) {} }
    return code;
  }

  var link = '', message = '';
  function render() {
    var code = API.code || getCode();
    link = CONFIG.baseUrl + '?ref=' + encodeURIComponent(code);
    message = buildMessage(link);
    $('dws-link').textContent = link.replace(/^https?:\/\//, '');
    $('dws-msg').innerHTML = esc(message).replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>');
    $('dws-wa').href = 'https://wa.me/?text=' + encodeURIComponent(message);
  }

  function copy(text, btn, done) {
    var orig = btn.textContent;
    var ok = function () { btn.textContent = done; setTimeout(function () { btn.textContent = orig; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, ok);
    else { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); ok(); }
  }
  function fire(channel) { if (typeof API.onShare === 'function') API.onShare(channel, link); }

  function open() {
    render();
    overlay.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () { overlay.classList.add('dws-show'); }); });
  }
  function close() { overlay.classList.remove('dws-show'); setTimeout(function () { overlay.hidden = true; }, 350); }

  overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
  document.querySelectorAll('[data-dws-close]').forEach(function (b) { b.addEventListener('click', close); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) close(); });
  $('dws-copylink').addEventListener('click', function () { copy(link, this, 'Copied'); fire('copy_link'); });
  $('dws-wa').addEventListener('click', function () { fire('whatsapp'); });
  $('dws-alt').addEventListener('click', function () {
    fire('native');
    if (navigator.share) navigator.share({ text: message }).catch(function () {});
    else copy(message, this, 'Message copied');
  });

  // Any element with data-diwali-share opens this pop-up (e.g. your "Share free test with your friend" button).
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-diwali-share]'); if (!t) return;
    e.preventDefault(); open();
  });

  var API = window.DiwaliShare = {
    open: open,
    close: close,
    code: null,     // set to your backend referral code before open() to override the random one
    onShare: null   // function (channel, link) — channel: whatsapp | copy_link | native
  };
})();
</script>
<!-- DEMO ONLY: opens the pop-up on load so you can preview this file. Remove when integrating. -->
<script>DiwaliShare.open();</script>
</body>
</html>
